<!-- Technische Rücksprung-Seite der Microsoft-Anmeldung (in Entra als einzige Adresse hinterlegt).
     MSAL schickt von hier zurück auf die Seite, auf der die Anmeldung begann.
     Wer die Adresse direkt aufruft, landet auf der Steuerung. Nicht im Menü. -->
<main class="container" style="padding:64px 16px"><p>Anmeldung wird abgeschlossen &hellip;</p></main>
<script src="/assets/vendor/msal-browser.min.js?v=202610080845"></script>
<script src="/assets/beta-mail.js?v=202610080845"></script>
<script>
  (function () {
    if (!/[#&?](code|error|state)=/.test(location.hash + location.search)) { location.replace("/strategie/steuerung.html"); return; }
    if (window.BetaMail) window.BetaMail.start().catch(function () {}).then(function () {
      setTimeout(function () { location.replace("/strategie/steuerung.html"); }, 4000);
    });
  })();
</script>
